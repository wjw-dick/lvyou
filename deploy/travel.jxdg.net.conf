server
{
    listen 80;
    server_name travel.jxdg.net;
    index index.html index.htm;
    root /home/www/wwwroot/travel.jxdg.net;

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.DS_Store|\.gitignore|\.gitattributes|composer\.json|package(-lock)?\.json|yarn\.lock|\.sql(\.gz)?|docker-compose\.yml|Dockerfile|pom\.xml|build\.gradle|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.vscode|\.idea|\.ssh|\.github|\.npm|node_modules|runtime)/ {
        return 404;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:18086/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        client_max_body_size 120m;
    }

    # 管理后台 (admin-web) 子目录 SPA
    location /admin/ {
        alias /home/www/wwwroot/travel.jxdg.net/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 门户 H5 (portal-web) 根 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/travel.jxdg.net.log;
    error_log  /www/wwwlogs/travel.jxdg.net.error.log;
}
