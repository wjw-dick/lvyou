services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-travel}
      MYSQL_USER: ${DB_USER:-travel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-travel123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: travel-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-travel}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-rabbit123456}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_MANAGE_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 8s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: travel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio123456}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    container_name: travel-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      MYSQL_PORT: 3306
      DB_NAME: ${DB_NAME:-travel}
      DB_USER: ${DB_USER:-travel}
      DB_PASSWORD: ${DB_PASSWORD:-travel123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER:-travel}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-rabbit123456}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-at-least-32-chars}
      AES_KEY: ${AES_KEY:-please-change-this-aes-key-32chars!}
      WECHAT_MOCK: ${WECHAT_MOCK:-true}
      STORAGE_LOCAL_DIR: /app/data/upload
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/app/data/upload
      - backup-data:/app/data/backup
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  admin-web:
    build: ../admin-web
    container_name: travel-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-80}:80"

  portal-web:
    build: ../portal-web
    container_name: travel-portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORTAL_PORT:-8082}:80"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  upload-data:
  backup-data:
