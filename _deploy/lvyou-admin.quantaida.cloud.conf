server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name lvyou-admin.quantaida.cloud;
    root /www/wwwroot/lvyou-admin.quantaida.cloud;
    index index.html;
    charset utf-8;

    ssl_certificate     /www/server/panel/vhost/cert/lvyou.quantaida.cloud/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/lvyou.quantaida.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 200m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 后端 API（context-path=/api）；^~ 防止被下方静态资源正则抢走
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # 本地对象存储（app.storage.public-prefix=/upload）
    location ^~ /upload/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/lvyou-admin.quantaida.cloud.log;
    error_log   /www/wwwlogs/lvyou-admin.quantaida.cloud.error.log;
}
